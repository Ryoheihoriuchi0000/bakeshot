[project]
name = "bakeshot"
version = "0.2.0"
description = "Capture the same UI your users see, without a simulator or a device."
readme = "README.md"
license = { text = "MIT" }
keywords = ["ios", "screenshots", "app-store", "fastlane", "snapshot", "swiftui", "xcode"]
classifiers = [
  "Environment :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]

requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/Ryoheihoriuchi0000/bakeshot"
Issues = "https://github.com/Ryoheihoriuchi0000/bakeshot/issues"

[project.scripts]
bakeshot = "bakeshot.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bakeshot*"]

[tool.setuptools.package-data]
bakeshot = ["hostkit/*", "hostkit/skill/*"]
